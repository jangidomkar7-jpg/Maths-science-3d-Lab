
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science 3D Lab</title>

  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 { margin: 18px 0 8px; }

    #viewer {
      width: 100%;
      height: 60vh;
      min-height: 300px;
      background: #17243a;
    }

    #status {
      padding: 12px;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      background: #35b8ef;
      color: #071522;
      font-weight: bold;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <h2>🔬 Science 3D Lab</h2>
  <div id="viewer"></div>
  <div id="status">Loading 3D character...</div>

  <button id="play">Play</button>
  <button id="stop">Stop</button>
  <button id="reset">Reset</button>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from
      "three/addons/loaders/GLTFLoader.js";

    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17243a);

    const camera = new THREE.PerspectiveCamera(
      45, viewer.clientWidth / viewer.clientHeight, 0.1, 1000
    );
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    viewer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2));

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(3, 5, 4);
    scene.add(light);

    const grid = new THREE.GridHelper(10, 10, 0x4488aa, 0x334455);
    scene.add(grid);

    const loader = new GLTFLoader();
    const clock = new THREE.Clock();

    let character = null;
    let mixer = null;
    let actions = [];
    let playing = true;

    loader.load(
      "./free_animated_male_character_in_blender.glb",

      (gltf) => {
        character = gltf.scene;
        scene.add(character);

        const box = new THREE.Box3().setFromObject(character);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        character.position.sub(center);

        const maxSize = Math.max(size.x, size.y, size.z);
        if (maxSize > 0) {
          character.scale.setScalar(2 / maxSize);
        }

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(character);

          actions = gltf.animations.map((clip) =>
            mixer.clipAction(clip)
          );

          actions[0].play();
          status.textContent =
            "Character loaded! Animation: " +
            gltf.animations.length;
        } else {
          status.textContent =
            "Character loaded, but no embedded animations found.";
        }
      },

      undefined,

      (error) => {
        console.error(error);
        status.textContent =
          "Loading failed. Check the GLB filename and file path.";
      }
    );

    document.getElementById("play").onclick = () => {
      playing = true;
      if (actions.length) actions.forEach(a => a.play());
    };

    document.getElementById("stop").onclick = () => {
      playing = false;
    };

    document.getElementById("reset").onclick = () => {
      if (mixer) mixer.stopAllAction();
      actions.forEach(a => {
        a.reset();
        a.play();
      });
      playing = true;
    };

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      if (mixer && playing) mixer.update(delta);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      const w = viewer.clientWidth;
      const h = viewer.clientHeight;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  </script>
</body>
</html>
